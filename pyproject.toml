[project]
name = "flora-deploy"
version = "0.0.1"
description = "Deploy NVIDIA Flora robotics labeling models at scale on Modal"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE.md"]
requires-python = ">=3.11"
dependencies = [
    "av==16.0.1",
    "huggingface_hub>=1.29,<2.0",
    # Exact pin, kept equal to RUNTIME["modal_client"] (tests/unit/test_modal_app_images.py).
    # The client renders every image build step and picks add_python's standalone Python, so the
    # image fingerprints are only meaningful for this client; modal_app/images.py refuses any
    # other. Bump both together, deliberately (it re-fingerprints every image).
    "modal==1.6.2",
    "numpy<3",
    "Pillow>=11,<13",
    "pyarrow>=17",
    "pydantic>=2",
    "pyyaml>=6",
    "rich>=13",
    "typer>=0.12",
]

[project.scripts]
flora = "flora_deploy.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-xdist>=3.6",
    "ruff>=0.6",
]
# CPU-only stack needed to exercise NVIDIA's code in `-m nvlink` tests; mirrors the pins in
# NVIDIA's batch_utils/requirements.txt (no GPU, no weights).
nvlink = [
    "torch==2.11.0",
    "torchvision==0.26.0",
    "transformers==5.8.1",
    "peft==0.18.1",
    "safetensors==0.7.0",
    "accelerate==1.12.0",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flora_deploy"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # lets tests import shared fakes as `tests.fakes`
asyncio_mode = "auto"
markers = [
    "nvlink: needs NVIDIA's code pins fetched via scripts/fetch_nv_code.py (CPU only)",
    "modal: runs on the Modal account (costs money; never in CI)",
    "torch: needs the CPU torch stack (`--group nvlink`); CI runs these in the nvlink job",
]
addopts = "-m 'not modal'"
