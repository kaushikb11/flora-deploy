[project]
name = "flora-deploy"
version = "0.0.1"
description = "Deploy NVIDIA Flora robotics labeling models at scale on Modal"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE.md"]
requires-python = ">=3.11"
dependencies = [
    "huggingface_hub>=1.29,<2.0",
    "rich>=13",
    "typer>=0.12",
]

[project.scripts]
flora = "flora_deploy.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flora_deploy"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
