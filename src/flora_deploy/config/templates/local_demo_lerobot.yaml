# flora.yaml: the local demo on a LeRobot dataset, so `flora export` can be tried too:
#
#   flora init --template local_demo_lerobot
#   flora run --local --fake-models --sample-data      # makes ./sample-lerobot, then runs the job
#   flora export --to lerobot --out labeled/ --allow-fake
#
# No Modal account, no GPU, no NVIDIA weights. The models are deterministic fakes, so the
# outputs only demonstrate the pipeline (index -> plan -> run -> compose -> results); they are
# marked `certificate: local-fake-models` and never share a config hash with real outputs.
# Fake-models jobs run under `<project>.fake`, so they never share job state with real jobs.
# Common keys are documented in `flora init --template exact_lerobot`; the full list is in
# src/flora_deploy/config/schema.py. Unknown keys are an error.

project: local-demo-lerobot

# NVIDIA's Flora models are licensed for non-commercial research only. Required.
license_ack: research-only

modal:
  environment: main
  max_gpus: 4                       # the local spawner honours the same GPU cap
  budget_usd: 5                     # priced as if on Modal; the budget gate is the real one
  region: null
  tags: {}

preset: exact

input:
  format: lerobot_v3                # a 6-episode, one-camera LeRobot v3.0 dataset
  path: ./sample-lerobot            # relative to this file
  stage_to: null

pipeline:
  stages: [segment, caption, reward.terminal, reward.dense]
  embodiment: human
  episode_instruction:
    source: dataset_task            # each episode's LeRobot task
  envelope: warn
  shard_target_gpu_minutes: 0.5     # GPU-minutes per shard (default 10); small shards, so the
                                    # demo has several of each kind

resources:
  segcap: {max_containers: 2}
  reward.terminal: {max_containers: 1}
  reward.dense: {max_containers: 1}

output:
  sink: volume://flora-results/local-demo-lerobot   # Modal runs; `--local` writes ./flora-local-store
  formats: [parquet, jsonl]

retries:
  max_starts_before_quarantine: 3
