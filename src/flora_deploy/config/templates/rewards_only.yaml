# flora.yaml: score policy rollouts with the Flora Rewarder only (terminal + dense rewards).
# Common keys are documented in `flora init --template exact_lerobot`;
# the full list is in src/flora_deploy/config/schema.py.
# Unknown keys are an error.

project: my-rollout-rewards

# NVIDIA's Flora models are licensed for non-commercial research only. Required.
license_ack: research-only

modal:
  environment: main
  max_gpus: 2
  budget_usd: 10
  region: null
  tags: {team: eval}

preset: exact                       # rewards run NVIDIA's offline vLLM engine on H100!

input:
  format: mp4_dir
  path: ./rollouts                  # local directory (`flora index --local` reads it here)
  # Workers read the uploaded copy: modal volume put flora-media ./rollouts rollouts
  stage_to: volume://flora-media/rollouts

pipeline:
  stages: [reward.terminal, reward.dense]
  embodiment: yam                   # human | yam | yam32 | dex | tianji
  episode_instruction:
    source: dataset_task            # task text from <video>.txt next to each MP4 (an episode
                                    # without one is excluded: missing_task); or `fixed` + `text`
                                    # (`none` is refused: reward prompts need a task)
  envelope: warn
  # terminal_rationale: false       # true: reward.terminal also returns NVIDIA's rationale

resources:
  reward.terminal: {gpu: H100!, max_containers: 1}
  reward.dense: {gpu: H100!, max_containers: 1}

output:
  sink: volume://flora-results/rollout-rewards
  formats: [parquet]
